server {
    listen 80;
    server_name localhost;

    # Root directory
    root /usr/share/nginx/html;
    index chatbot/index.html;

    # Serve Chatbot at / (root)
    location / {
        try_files $uri $uri/ /chatbot/index.html;
    }
    
    # Serve Chatbot explicitly at /chatbot
    location /chatbot {
        alias /usr/share/nginx/html/chatbot;
        index index.html;
    }

    # Serve Dashboard at /dashboard
    location /dashboard {
        alias /usr/share/nginx/html/dashboard;
        index index.html;
    }

    # Reverse Proxy API requests to Backend
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
