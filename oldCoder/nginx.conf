worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # Root directory for static files
        root /usr/share/nginx/html;
        index chatbot/index.html;

        # Serve Chatbot at / (root)
        location / {
            try_files $uri $uri/ /chatbot/index.html;
        }
        
        # Serve Chatbot explicitly at /chatbot
        location /chatbot {
            alias /usr/share/nginx/html/chatbot;
            index index.html;
        }

        # Serve Dashboard at /dashboard
        location /dashboard {
            alias /usr/share/nginx/html/dashboard;
            index index.html;
        }

        # Reverse Proxy API requests to Local Backend (FastAPI running on 8000)
        location /api {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
