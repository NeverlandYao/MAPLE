version: '3.8'

services:
  backend:
    build: ./backend
    container_name: maple_backend
    volumes:
      - ./backend:/app
      - ./data/logs:/app/data/logs # Persist logs
    environment:
      - MS_API_KEY=${MS_API_KEY}
      - MS_BASE_URL=${MS_BASE_URL}
      - MS_MODEL=${MS_MODEL}
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maple_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
